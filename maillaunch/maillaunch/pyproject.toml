[project]
name = "maillaunch"
version = "1.0.0"
description = "CLI for sending personalised cold email via Gmail or Microsoft Graph."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "keyring>=24.0",
    "cryptography>=42.0",
]

# Gives you the `maillaunch` command after `pip install -e .`
[project.scripts]
maillaunch = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
